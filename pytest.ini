[pytest]
pythonpath = backend
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore:.*datetime\.datetime\.utcnow.*:DeprecationWarning
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
    ignore::pydantic.PydanticDeprecatedSince20
